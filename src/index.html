<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Soundscape</title>

    <script>
        // Apply the saved theme before the first paint to avoid a flash of the
        // default light theme. "system" is handled by CSS media queries.
        try {
            const theme = localStorage.getItem("soundscape.themePreference");
            if (theme === "dark" || theme === "light") {
                document.documentElement.dataset.theme = theme;
            }
        } catch {}
    </script>

    <meta name="description" content="A calm, installable ambience player for seamless looping background audio." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="resources/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="resources/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="resources/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="resources/icons/apple-touch-icon.png" />
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <header class="app-header">
            <div class="app-brand">
                <p class="app-name">Soundscape</p>
                <a class="app-byline" href="https://builduseful.com" target="_blank" rel="noopener">by Build Useful.</a>
            </div>
            <div class="header-actions">
                <!-- Always shown, except on a browser with no way to cast at
                     all. Finding out whether a device is on the network first
                     would mean scanning it continuously, for the whole life of
                     the page, to decide the visibility of one button — and both
                     platforms discover devices inside their own picker anyway.
                     So the button asks nothing until it is pressed.

                     Ships `hidden`: script.js reveals it once it knows a backend
                     exists, which keeps a Firefox visitor from seeing a control
                     flash in and out on load. -->
                <button class="cast" id="castButton" type="button" aria-label="Play on another device" data-cast-state="idle" hidden>
                    <svg class="button-icon cast-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 17.5a3.5 3.5 0 0 1 3.5 3.5M3 13.5A7.5 7.5 0 0 1 10.5 21M3 9.5A11.5 11.5 0 0 1 14.5 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                        <path d="M3 6.5v-1a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                        <!-- The filled screen is the connected state. Drawing it
                             on top of the idle glyph rather than shipping a
                             second copy of the whole icon keeps the two from
                             drifting apart. -->
                        <path class="cast-icon-screen" d="M7 7.75h10v8.5h-3.6A10.9 10.9 0 0 0 7 10.4V7.75Z" fill="currentColor" stroke="none"></path>
                    </svg>
                </button>
                <!-- The connection shows itself as a filled glyph, which says
                     nothing to a screen reader: the button's label changes, but
                     a label on an unfocused control is never announced. This is
                     the announcement. It stays out of the status strip under the
                     title on purpose — that strip is spoken for. -->
                <p id="castStatus" class="sr-only" role="status"></p>
                <app-menu id="appMenu">
                    <theme-selector id="themeSelector" value="system"></theme-selector>
                    <button type="button" class="menu-install" id="installButton" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v12"></path>
                            <path d="M7 10l5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                        <span>Install app</span>
                    </button>
                    <a class="app-version" id="appVersion" href="https://github.com/builduseful/soundscape" target="_blank" rel="noopener"></a>
                </app-menu>
            </div>
        </header>
        <main class="player">
            <div class="controls" aria-label="Playback controls">
                <div class="transport-controls">
                    <button class="prev" id="previousButton" type="button" aria-label="Previous track">
                        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M6 6.75h2.5v10.5H6V6.75Zm12.5 0v10.5L9.5 12l9-5.25Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <button class="play" id="playPauseButton" type="button" aria-label="Play" data-playing="false">
                        <svg class="button-icon play-icon play-icon--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M6.75 5.5v13l11-6.5-11-6.5Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path>
                        </svg>
                        <svg class="button-icon play-icon play-icon--pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="6.5" y="5.5" width="4" height="13" rx="0.5" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></rect>
                            <rect x="13.5" y="5.5" width="4" height="13" rx="0.5" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></rect>
                        </svg>
                    </button>
                    <button class="next" id="nextButton" type="button" aria-label="Next track">
                        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M5.5 6.75v10.5l9-5.25-9-5.25Zm10 0H18v10.5h-2.5V6.75Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="track-status">
                <h1 id="title" class="track-title" aria-live="polite">
                    <span class="track-title-text track-title-text--current">Soundscape</span>
                    <span class="track-title-text track-title-text--incoming" aria-hidden="true"></span>
                </h1>
                <p id="trackLoading" class="track-loading" role="status" hidden>
                    <span class="track-loading-bar" aria-hidden="true"></span>
                    <!-- Text is written by script.js rather than authored here: a
                         live region announces content changes it can observe, and
                         static text that only gets un-hidden gives it nothing. -->
                    <span id="trackLoadingLabel" class="track-loading-label"></span>
                </p>
            </div>
            <p id="playbackError" class="playback-error" role="status" hidden></p>
        </main>
        <footer class="app-footer">
            <volume-control id="volumeControl" value="1"></volume-control>
        </footer>
        <!-- Opted out of remote playback on purpose. This element's audio is
             diverted into the Web Audio graph by createMediaElementSource, so a
             browser or OS offering it as a cast source would hand the user a
             route the app knows nothing about — while the decoded buffer keeps
             playing locally, which is the two-places-at-once the design forbids.
             Casting has its own element below. -->
        <audio id="audioElement" preload="auto" disableremoteplayback x-webkit-airplay="deny"></audio>
        <!-- The cast transport. Never pass this to createMediaElementSource —
             see js/cast.js for why that would break casting outright.

             preload is "metadata" because macOS Safari refuses to open its
             picker on an element below HAVE_METADATA, so the header has to have
             been read before the button is pressed. Chromium does not need it —
             verified opening its picker at readyState 0 — but one rule for both
             is simpler.

             It is a hint, not a budget: Chrome reads well past the header on a
             file this small. What actually keeps that off the wire is that the
             element carries no src until someone touches the page, which
             js/cast.js explains. Nothing here is fetched on load.

             x-webkit-airplay="allow" is Safari's default rather than a
             requirement, but stating it keeps the opt-in explicit next to the
             element it applies to. -->
        <audio id="castAudioElement" preload="metadata" x-webkit-airplay="allow"></audio>
    </div>

    <script type="module" src="js/script.js"></script>

</body>

</html>
