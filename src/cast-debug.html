<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundscape cast diagnostics</title>
<style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
    p.lede { margin: 0 0 1rem; opacity: .75; font-size: .9rem; }
    button {
        display: block; width: 100%; margin: 0 0 .5rem;
        padding: .9rem 1rem; font-size: 1rem; font-family: inherit;
        border: 1px solid currentColor; border-radius: .5rem;
        background: transparent; color: inherit; text-align: left;
    }
    button:disabled { opacity: .4; }
    button b { display: block; font-size: .78rem; opacity: .7; font-weight: 400; }
    #log {
        width: 100%; height: 16rem; margin-top: 1rem; box-sizing: border-box;
        font-family: ui-monospace, monospace; font-size: .75rem;
        padding: .5rem; border-radius: .5rem;
    }
    .row { display: flex; gap: .5rem; }
    .row button { margin-bottom: 0; }
</style>

<h1>Soundscape cast diagnostics</h1>
<p class="lede">Tap the steps in order. Every result lands in the log at the bottom - copy it and send it back.</p>

<button id="step1"><span>1 - Environment</span><b>What this browser exposes. Runs automatically.</b></button>
<button id="step2"><span>2 - Load the cast file</span><b>Sets src on the audio element and waits for its header.</b></button>
<button id="step3"><span>3 - Remote Playback availability</span><b>Asks Chrome whether a cast device exists. Watches for 10s.</b></button>
<button id="step4"><span>4 - Presentation API availability</span><b>The path YouTube uses, as a cross-check.</b></button>
<button id="step5"><span>5 - Open the picker (Remote Playback)</span><b>The thing that does nothing today. Reports the exact error. Also used right after 7.</b></button>
<button id="step6"><span>6 - Open the picker (Presentation API)</span><b>An alternative route - casts the page rather than the file.</b></button>

<button id="step7"><span>7 - Play first, THEN ask</span><b>The big one. Plays the file silently, then watches for devices (~15s). Tap 5 straight after.</b></button>

<div class="row">
    <button id="copy">Copy log</button>
    <button id="clear">Clear</button>
</div>

<textarea id="log" readonly></textarea>

<audio id="media" preload="metadata" x-webkit-airplay="allow"></audio>

<script>
    const CAST_FILE = "resources/soundscapes/rain_loopable.m4a";
    const media = document.getElementById("media");
    const logBox = document.getElementById("log");
    const started = Date.now();

    // Every line is also sent to the server as a request path, so it lands in
    // Caddy's access log and can be read from the machine running the server.
    // An <img> rather than fetch(): no promise to handle, no CORS to think
    // about, and the request is guaranteed to leave even if the page is busy.
    // The 404 that comes back is irrelevant - the access log entry is the point.
    // Sequence-numbered because these are independent requests and can land out
    // of order; the reader sorts on it to rebuild the order they were written in.
    let beaconSequence = 0;
    // Marks which half of a cast session a line came from.
    let logPrefix = "";

    function beacon(text) {
        try {
            const seq = String(++beaconSequence).padStart(4, "0");

            new Image().src = `/__log/${seq}/${encodeURIComponent(text)}?t=${Date.now()}`;
        } catch {
            // A failed beacon must never take the on-screen log down with it.
        }
    }

    function log(line) {
        const stamped = `${logPrefix}[${String(Date.now() - started).padStart(6)}ms] ${line}`;

        logBox.value += `${stamped}\n`;
        logBox.scrollTop = logBox.scrollHeight;
        beacon(stamped);
    }

    function heading(text) {
        logBox.value += `\n=== ${text} ===\n`;
        beacon(`##### ${logPrefix}${text} #####`);
    }

    // The one number that separates "the picker opened and you closed it" from
    // "the browser refused instantly and pretended you closed it". Under ~100ms
    // means no picker was ever shown.
    function verdictForElapsed(ms) {
        return ms < 100 ? "INSTANT - no picker was shown" : "took real time - a picker probably opened";
    }

    document.getElementById("step1").addEventListener("click", () => {
        heading("1 - Environment");
        log(`ua: ${navigator.userAgent}`);
        log(`origin: ${location.origin}`);
        log(`secureContext: ${window.isSecureContext}`);
        log(`remote object: ${media.remote ? "present" : "MISSING"}`);
        log(`remote.watchAvailability: ${typeof media.remote?.watchAvailability}`);
        log(`remote.prompt: ${typeof media.remote?.prompt}`);
        log(`remote.state: ${media.remote?.state}`);
        log(`webkitShowPlaybackTargetPicker: ${typeof media.webkitShowPlaybackTargetPicker}`);
        log(`PresentationRequest: ${typeof window.PresentationRequest}`);
        log(`canPlayType(audio/mp4): "${media.canPlayType("audio/mp4")}"`);
        log(`deviceMemory: ${navigator.deviceMemory ?? "unknown"} GB (low-end disables casting in Chrome)`);
    });

    document.getElementById("step2").addEventListener("click", async () => {
        heading("2 - Load the cast file");
        log(`assigning src=${CAST_FILE}`);
        media.src = CAST_FILE;

        const outcome = await new Promise((resolve) => {
            const done = (why) => {
                clearTimeout(timer);
                media.removeEventListener("loadedmetadata", onLoaded);
                media.removeEventListener("error", onError);
                resolve(why);
            };
            const onLoaded = () => done("loadedmetadata");
            const onError = () => done("error event");
            const timer = setTimeout(() => done("TIMED OUT after 10s"), 10000);

            media.addEventListener("loadedmetadata", onLoaded);
            media.addEventListener("error", onError);
        });

        log(`outcome: ${outcome}`);
        log(`readyState: ${media.readyState} (needs >= 1)`);
        log(`duration: ${media.duration} (needs > 15)`);
        log(`currentSrc: ${media.currentSrc || "(empty)"}`);
        log(`error: ${media.error ? `code ${media.error.code} - ${media.error.message}` : "none"}`);
    });

    document.getElementById("step3").addEventListener("click", async () => {
        heading("3 - Remote Playback availability");

        if (media.readyState < 1) log("WARNING: run step 2 first - without a duration this always answers false.");

        try {
            const id = await media.remote.watchAvailability((available) => log(`callback: available=${available}`));
            log(`watch registered, id=${id}`);
            log("watching for 10s...");
            await new Promise((resolve) => setTimeout(resolve, 10000));
            log("done watching. Only the first callback firing means Chrome never started looking.");
            await media.remote.cancelWatchAvailability(id);
        } catch (error) {
            log(`REJECTED: ${error.name} - ${error.message}`);
        }
    });

    document.getElementById("step4").addEventListener("click", async () => {
        heading("4 - Presentation API availability");

        try {
            const request = new PresentationRequest(["cast:CC1AD845"]);
            const availability = await request.getAvailability();

            log(`initial value: ${availability.value}`);
            availability.addEventListener("change", () => log(`changed to: ${availability.value}`));
            log("watching for 8s...");
            await new Promise((resolve) => setTimeout(resolve, 8000));
            log(`final value: ${availability.value} - true means a cast device really is reachable`);
        } catch (error) {
            log(`REJECTED: ${error.name} - ${error.message}`);
        }
    });

    // No awaits before prompt(): both APIs require transient user activation,
    // and anything awaited first risks spending it.
    document.getElementById("step5").addEventListener("click", () => {
        heading("5 - Open the picker (Remote Playback)");
        log(`readyState=${media.readyState} duration=${media.duration}`);

        if (media.readyState < 1) log("WARNING: no metadata - run step 2 first.");

        const at = Date.now();

        media.remote.prompt().then(
            () => log(`RESOLVED after ${Date.now() - at}ms - connected`),
            (error) => {
                const ms = Date.now() - at;
                log(`REJECTED after ${ms}ms: ${error.name} - ${error.message}`);
                log(`verdict: ${verdictForElapsed(ms)}`);
            },
        );
    });

    document.getElementById("step6").addEventListener("click", () => {
        heading("6 - Open the picker (Presentation API)");
        const at = Date.now();

        try {
            // This page rather than the app's home page, so whatever ends up
            // running on the other end reports back through the same beacon.
            const request = new PresentationRequest([`${location.origin}${location.pathname}`]);

            request.start().then(
                (connection) => log(`RESOLVED after ${Date.now() - at}ms - id=${connection.id}`),
                (error) => {
                    const ms = Date.now() - at;
                    log(`REJECTED after ${ms}ms: ${error.name} - ${error.message}`);
                    log(`verdict: ${verdictForElapsed(ms)}`);
                },
            );
        } catch (error) {
            log(`THREW: ${error.name} - ${error.message}`);
        }
    });

    // Chrome will not treat a media element as castable until its pipeline has
    // actually run: before playback the source is still flagged incompatible, so
    // there are no availability URLs and prompt() refuses instantly. Playing
    // first is what moves the failure from NotAllowedError (no picker exists) to
    // a real answer about devices.
    document.getElementById("step7").addEventListener("click", async () => {
        heading("7 - Play first, THEN ask");

        if (media.readyState < 1) {
            log("loading the file first...");
            media.src = CAST_FILE;
            await new Promise((resolve) => {
                media.addEventListener("loadedmetadata", resolve, { once: true });
                setTimeout(resolve, 8000);
            });
        }

        // Silent on purpose: this is a probe, not a listening session.
        media.volume = 0;

        try {
            await media.play();
            log(`play() ok - paused=${media.paused}`);
        } catch (error) {
            log(`play() FAILED: ${error.name} - ${error.message}`);
        }

        await new Promise((resolve) => setTimeout(resolve, 2500));
        log(`currentTime=${media.currentTime.toFixed(2)} (needs to be moving)`);

        const at = Date.now();

        try {
            const id = await media.remote.watchAvailability(
                (available) => log(`availability=${available} @${Date.now() - at}ms`),
            );
            log(`watch id=${id} - watching 12s while playing...`);
            await new Promise((resolve) => setTimeout(resolve, 12000));
            await media.remote.cancelWatchAvailability(id);
        } catch (error) {
            log(`watch REJECTED: ${error.name} - ${error.message}`);
        }

        // Deliberately does not prompt. Transient user activation expires after
        // about five seconds, and the watch above outlives it — prompting here
        // would fail with InvalidAccessError and tell us nothing. It needs its
        // own fresh tap.
        log("NOW TAP STEP 5 - the file is still playing, which is the point.");
    });

    document.getElementById("copy").addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(logBox.value);
            log("(log copied to clipboard)");
        } catch {
            logBox.select();
            log("(select-all done - use the OS copy)");
        }
    });

    document.getElementById("clear").addEventListener("click", () => {
        logBox.value = "";
    });

    // Whatever the cast device (or Chrome's offscreen renderer) ends up running
    // arrives here with navigator.presentation.receiver set. It reports through
    // the same beacon as the sender, so both halves of the session land in one
    // log. Sequence numbers start high so receiver lines sort after the sender's
    // rather than interleaving with them.
    //
    // The autoplay attempt is the whole question: a presented page gets no user
    // gesture, so whether it may make sound decides whether this route can carry
    // a soundscape at all.
    if (navigator.presentation?.receiver) {
        beaconSequence = 5000;
        logPrefix = "RX ";

        heading("RECEIVER - this page is running as the cast target");
        log(`ua: ${navigator.userAgent}`);
        log(`origin: ${location.origin}`);
        log(`screen: ${screen.width}x${screen.height}`);

        navigator.presentation.receiver.connectionList.then((list) => {
            log(`connections: ${list.connections.length}`);
            list.addEventListener("connectionavailable", () => log("a sender connected"));
        }, (error) => log(`connectionList failed: ${error.name}`));

        media.src = CAST_FILE;
        media.volume = 1;
        media.loop = true;

        media.play().then(
            () => log("AUTOPLAY OK - the soundscape should be audible on the device"),
            (error) => log(`AUTOPLAY BLOCKED: ${error.name} - ${error.message}`),
        );

        setTimeout(() => log(`currentTime=${media.currentTime.toFixed(2)} paused=${media.paused}`), 4000);
    } else {
        document.getElementById("step1").click();
    }
</script>
