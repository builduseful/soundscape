<!DOCTYPE html>
<html>

<head>
    <title>Soundscape</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <h1 id="title">Soundscape</h1>
        <div class="controls">
            <button class="prev" id="previousButton" type="button" aria-label="Previous track">
                &lt;&lt;
            </button>
            <button class="play" id="playPauseButton" type="button" aria-label="Play">
                Play
            </button>
            <button class="next" id="nextButton" type="button" aria-label="Next track">
                &gt;&gt;
            </button>
            <input type="range" min="0" max="1" value="1" step="0.01" id="volumeSlider">
        </div>
        <audio id="audioElement">
            <source src="resources/soundscapes/silence-30s.ogg" type="audio/ogg">
        </audio>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
