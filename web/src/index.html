<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Soundscape</title>

    <script>
        // Apply the saved theme before the first paint to avoid a flash of the
        // default light theme. "system" needs nothing: style.css's
        // color-scheme already follows the OS.
        try {
            const theme = localStorage.getItem("soundscape.themePreference");
            if (theme === "dark" || theme === "light") {
                document.documentElement.dataset.theme = theme;
            }
        } catch {}
    </script>

    <meta name="description" content="A calm, installable ambience player for seamless looping background audio." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="resources/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="resources/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="resources/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="resources/icons/apple-touch-icon.png" />
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <header class="app-header">
            <div class="app-brand">
                <p class="app-name">Soundscape</p>
                <a class="app-byline" href="https://builduseful.com" target="_blank" rel="noopener">by Build Useful.</a>
            </div>
            <div class="header-actions">
                <app-menu id="appMenu">
                    <theme-selector id="themeSelector" value="system"></theme-selector>
                    <button type="button" class="menu-install" id="installButton" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v12"></path>
                            <path d="M7 10l5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                        <span>Install app</span>
                    </button>
                    <a class="app-version" id="appVersion" href="https://github.com/builduseful/soundscape" target="_blank" rel="noopener"></a>
                </app-menu>
            </div>
        </header>
        <main class="player">
            <div id="trackStatus" class="track-status">
                <!-- The soundscape, drawn: the centre of the screen. It moves
                     while the sound plays and holds still while it does not. -->
                <div class="track-stage" aria-hidden="true">
                    <track-scene id="trackScene"></track-scene>
                </div>
                <div class="controls" aria-label="Playback controls">
                    <div class="transport-controls">
                        <button class="prev" id="previousButton" type="button" aria-label="Previous track">
                            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M17 6.5 9 12l8 5.5ZM6.5 6.5v11"></path>
                            </svg>
                        </button>
                        <button class="play" id="playPauseButton" type="button" aria-label="Play" data-playing="false"></button>
                        <button class="next" id="nextButton" type="button" aria-label="Next track">
                            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M7 6.5 15 12l-8 5.5ZM17.5 6.5v11"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <h1 id="title" class="track-title" aria-live="polite">
                    <span class="track-title-text track-title-text--current">Soundscape</span>
                    <span class="track-title-text track-title-text--incoming" aria-hidden="true"></span>
                </h1>
                <p id="trackLoading" class="track-loading" role="status" hidden>
                    <span class="track-loading-bar" aria-hidden="true"></span>
                    <!-- Text is written by script.js rather than authored here: a
                         live region announces content changes it can observe, and
                         static text that only gets un-hidden gives it nothing. -->
                    <span id="trackLoadingLabel" class="track-loading-label"></span>
                </p>
                <div id="gestureVolume" class="gesture-volume" aria-hidden="true">
                    <span class="gesture-volume-fill"></span>
                </div>
            </div>
            <!-- The soundscape a swipe is bringing in, a screen's width away
                 beside this one; laid out as the real one is, so the change
                 from it to the real one cannot be seen. -->
            <div id="trackPeek" class="track-status track-peek" aria-hidden="true" hidden>
                <div class="track-stage">
                    <track-scene id="trackPeekScene"></track-scene>
                </div>
                <p class="track-title"><span id="trackPeekTitle" class="track-title-text"></span></p>
            </div>
            <p id="playbackError" class="playback-error" role="status" hidden></p>
        </main>
        <footer class="app-footer">
            <volume-control id="volumeControl" value="1"></volume-control>
        </footer>
        <gesture-tutorial id="gestureTutorial" hidden></gesture-tutorial>
        <!-- Opted out of remote playback on purpose. This element's audio is
             diverted into the Web Audio graph by createMediaElementSource, so a
             browser or OS offering it as a cast or AirPlay source would hand the
             user a route the app knows nothing about — while the decoded buffer
             keeps playing locally, sound in two places at once. -->
        <audio id="audioElement" preload="auto" disableremoteplayback x-webkit-airplay="deny"></audio>
    </div>

    <script type="module" src="js/script.js"></script>

</body>

</html>
