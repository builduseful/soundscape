name: Android

# Only what the Android build reads: its own project, the contract it is
# generated from, and the audio it bundles.
on:
  push:
    branches: [trunk]
    paths: &android-paths
      - android/**
      - shared/**
      - web/src/resources/soundscapes/**
      - .github/workflows/android.yml
  pull_request:
    branches: [trunk]
    paths: *android-paths
  workflow_dispatch:

jobs:
  # JVM tests, lint (warnings are errors), a debug build, and the device suites
  # compiled. Running those on emulators joins in Phase 12 of
  # docs/native-apps-plan.md.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      # The runner's preinstalled SDK is used as-is; AGP fetches any platform or
      # build-tools it lacks.
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21
          cache: gradle
      # The device suites need an emulator; compiling them here keeps them from rotting.
      - run: ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :e2e:assembleDebug
